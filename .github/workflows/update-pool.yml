name: 更新題庫

# 規格 2-8：排程與手動觸發不得並行，否則兩個 job 會從不同基線各自發布
concurrency:
  group: pool-update
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 20 1 * *'      # 每月 1 日 04:00 (Asia/Taipei)
  workflow_dispatch:
    inputs:
      allow_any_delta:
        description: '略過 ±3% 變動門檻（確認過差異才勾）'
        type: boolean
        default: false
      verify_all:
        description: '重抓全部圖片並比對雜湊（偵測原地換圖，每季一次）'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write     # 失敗時開 issue 需要；少了這個通知機制本身會 403（覆審 C3）

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330        # 低於 Actions 單 job 6 小時上限

    # 所有 action 一律釘 40 碼 commit SHA，不用可變動的 tag。
    # 這個 job 有 `contents: write` 並會把產出的題庫推回 main——
    # tag 可以被上游改指向，等於讓第三方在我們的發布路徑上獲得任意程式碼執行。
    # 尾註的版本號只是給人看的，權威是 SHA。升版時一起改兩者。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          # 不可降回 20：`node --test` 的 glob 展開是 Node 21 才有的。
          # Node 20 會把 `tests/**/*.test.mjs` 當字面路徑，
          # 於是「測試找不到檔案」被當成「題庫沒過驗收」——2026-08-01 的假警報。
          node-version: '24'

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86   # v5.4.2
        with:
          # 釘住 action 卻讓它去抓「最新的 uv」，等於留著同一個入口：
          # 解析與安裝 Python 依賴的就是這支執行檔
          version: '0.11.8'

      # ── 建置題庫 ────────────────────────────────────────────────
      # 任一驗證失敗即 exit 1，data/ 不變（規格 D9 全有全無、B1）
      - name: 建置題庫
        run: |
          node tools/build-pool.mjs \
            ${{ inputs.allow_any_delta && '--allow-any-delta' || '' }}

      # ── 鏡像圖片 ────────────────────────────────────────────────
      # 暫時性下載失敗重試 3 次後仍失敗 → 整批中止，不得用刪題吸收（規格 B8）
      #
      # `--locked` 強制照 tools/fetch-images.py.lock 安裝（含傳遞依賴與 sha256）。
      # 少了它，PEP 723 的 `pillow>=10` 會在每次排程解析成當下最新版——
      # 圖片解碼與寫檔就在這一步，供應鏈換版即可影響寫進 repo 的資產。
      # 依賴有變動時跑 `uv lock --script tools/fetch-images.py` 更新 lock。
      - name: 鏡像圖片
        run: |
          uv run --locked --script tools/fetch-images.py --workers 12 \
            ${{ inputs.verify_all && '--verify-all' || '' }}

      # ── 驗收 ────────────────────────────────────────────────────
      # A 組（engine）與 B 組（資料完整性）都必須綠燈才允許發布
      - name: 單元測試
        run: node --test "tests/**/*.test.mjs"

      - name: 資料完整性驗證
        run: node tools/verify-data.mjs

      # ── 發布 ────────────────────────────────────────────────────
      - name: 提交變更
        run: |
          if git diff --quiet -- data/; then
            echo "題庫無變更，不提交"
            exit 0
          fi
          COUNT=$(node -e "console.log(require('./data/pool.json').meta.count)")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): 更新題庫至 ${COUNT} 題

          由 update-pool workflow 自動產生。"
          git push

      - name: 摘要
        if: always()
        run: |
          {
            echo "### 題庫更新"
            if [ -f data/pool.json ]; then
              node -e '
                const m = require("./data/pool.json").meta;
                console.log("| 項目 | 值 |\n|---|---|");
                console.log(`| 題數 | ${m.count} |`);
                console.log(`| 來源筆數 | ${m.source_rows} |`);
                console.log(`| 資料檔 | \`${m.source_file}\` |`);
                console.log(`| 內容雜湊 | \`${m.content_hash.slice(0, 23)}…\` |`);
                console.log(`| 停用容錯鍵數 | ${(m.no_fuzzy || []).length} |`);
                for (const [k, v] of Object.entries(m.stages || {})) console.log(`| ${k} | ${v} |`);
                // excluded.json 也要報：只讀 pool 的話，半寫入或成對驗證失敗時
                // 仍會顯示看似成功的題庫統計，造成操作層面的虛假完成感
                const fs = require("fs");
                if (!fs.existsSync("./data/excluded.json")) {
                  console.log("| **excluded.json** | ⚠️ **不存在——未命中三分類會靜默失效** |");
                } else {
                  const ex = require("./data/excluded.json");
                  const paired = ex.meta.content_hash === m.content_hash;
                  console.log(`| excluded 筆數 | ${ex.meta.count} |`);
                  console.log(`| 兩檔成對 | ${paired ? "✓" : "✖ **content_hash 不一致**"} |`);
                  const by = {};
                  for (const it of ex.items) by[it.stage] = (by[it.stage] || 0) + 1;
                  console.log(`| 淘汰階段 | ${Object.entries(by).sort().map(([k, v]) => `${k} ${v}`).join(" ／ ")} |`);
                }
              '
            else
              echo '⚠️ 未產出 pool.json'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 變動幅度超標時 build-pool 會 exit 1；開 issue 交人工裁決（規格 D9／4-2）
      - name: 失敗時開 issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b   # v7.1.0
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `題庫自動更新失敗（${new Date().toISOString().slice(0, 10)}）`,
              labels: ['data-pipeline'],
              body: [
                '排程更新未通過驗證，**題庫維持上一成功版本**（規格 D9 全有全無）。',
                '',
                `執行記錄：${url}`,
                '',
                '常見原因與處置：',
                '- **變動幅度超出 ±3% 或移除 >50 題** — 確認來源真的有大量異動後，',
                '  手動以 `allow_any_delta` 重跑。',
                '- **圖片下載失敗** — 多為 TFDA 端暫時性問題，直接重跑即可。',
                '- **來源非 200 / 非合法 ZIP** — 對方服務異常或 WAF 阻擋，擇日重試。',
                '- **A4 誤接受不為 0** — 新藥名與既有藥名僅差 1 字元，',
                '  確認 `no_fuzzy` 清單已涵蓋。',
              ].join('\n'),
            });
